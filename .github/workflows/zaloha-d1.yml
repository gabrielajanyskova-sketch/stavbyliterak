# Týdenní záloha obsahu webu z D1 (texty, stránky, ceny gastra, seznam nahraných fotek).
# Přihlašovací relace a kódy do adminu se nezálohují. Záloha je ke stažení v Actions
# u každého běhu (Artifacts) 90 dní. Návod k obnovení je v README.
# Potřebuje secrets CLOUDFLARE_API_TOKEN (oprávnění D1) a CLOUDFLARE_ACCOUNT_ID.
name: Záloha obsahu (D1)

on:
  schedule:
    - cron: '17 3 * * 1' # každé pondělí 3:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zaloha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export obsahových tabulek
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.155.0 d1 export stavbyliterak --remote --table site --table pages --table images --output "zaloha-$(date -u +%F).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: zaloha-d1-${{ github.run_number }}
          path: zaloha-*.sql
          retention-days: 90
          if-no-files-found: error
