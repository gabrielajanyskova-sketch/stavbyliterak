<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrace webu</title>
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
  :root {
    --graphite: #1d2126; --graphite-2: #2a3037; --ink: #1b1f24; --muted: #5b636c;
    --concrete: #e7e9ea; --paper: #f4f5f5; --line: #c3c8cc; --amber: #f39a1e; --amber-deep: #c86a04;
    --danger: #b3261e; --ok: #2e7d32;
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font-body); }
  h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; line-height: 1.05; margin: 0 0 12px; }
  h2 { font-size: 2rem; }
  h3 { font-size: 1.3rem; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  [hidden] { display: none !important; }

  .topbar { background: var(--graphite); color: #fff; border-bottom: 3px solid var(--amber); display: flex; align-items: center; gap: 16px; padding: 10px 20px; position: sticky; top: 0; z-index: 20; }
  .topbar img { width: 84px; }
  .topbar .title { font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .03em; }
  .topbar .spacer { flex: 1; }
  .topbar a, .topbar button { color: #d9dde0; background: none; border: 0; cursor: pointer; text-decoration: none; font-size: .95rem; }
  .topbar a:hover, .topbar button:hover { color: var(--amber); }

  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 66px); }
  .side { background: var(--concrete); border-right: 1px solid var(--line); padding: 20px 14px; }
  .side h4 { font: .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 6px 8px; }
  .side ul { list-style: none; margin: 0; padding: 0; }
  .side li { display: flex; align-items: center; gap: 2px; }
  .side li button.nav { flex: 1; text-align: left; background: none; border: 0; padding: 8px 8px; cursor: pointer; border-left: 3px solid transparent; }
  .side li button.nav:hover { background: #fff; }
  .side li button.nav.active { background: #fff; border-left-color: var(--amber); font-weight: 600; }
  .side li .draft { font: .7rem var(--font-mono); color: var(--muted); margin-left: 6px; }
  .side .mini { background: none; border: 0; cursor: pointer; padding: 4px 6px; color: var(--muted); }
  .side .mini:hover { color: var(--ink); }
  .main { padding: 28px clamp(16px, 4vw, 48px) 120px; max-width: 980px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  .panel { background: #fff; border: 1px solid var(--line); padding: 20px; margin-bottom: 20px; }
  .panel > h3 { border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .hint { font-size: .85rem; color: var(--muted); margin: 4px 0 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .field { margin-bottom: 14px; }
  .field > label, .lbl { display: block; font: .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
  input[type=text], input[type=password], input[type=email], input:not([type]), select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); background: #fff; border-radius: 0;
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--amber); outline-offset: 0; border-color: var(--amber); }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--amber-deep); }

  .btn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 9px 16px; background: var(--amber); color: var(--graphite); border: 2px solid var(--amber); cursor: pointer; text-decoration: none; }
  .btn:hover { background: #ffb24a; border-color: #ffb24a; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-line { background: #fff; border-color: var(--ink); }
  .btn-line:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-small { font-size: .9rem; padding: 5px 10px; }
  .btn-danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .row-actions { display: flex; gap: 4px; }
  .icon { background: #fff; border: 1px solid var(--line); width: 30px; height: 30px; cursor: pointer; display: inline-grid; place-items: center; font-size: .95rem; }
  .icon:hover { border-color: var(--ink); }
  .icon.del:hover { border-color: var(--danger); color: var(--danger); }

  .block { border: 1px solid var(--line); border-left: 4px solid var(--amber); background: var(--paper); padding: 14px; margin-bottom: 12px; }
  .block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .block-head .type { font: .78rem var(--font-mono); text-transform: uppercase; letter-spacing: .07em; flex: 1; }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px; background: #fff; border: 1px solid var(--line); margin-bottom: 8px; }
  .item .fields { display: grid; gap: 6px; }
  .item textarea { min-height: 60px; }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .add-row select { width: auto; }

  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--graphite); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; justify-content: flex-end; z-index: 30; border-top: 3px solid var(--amber); }
  .savebar .msg { flex: 1; font-size: .95rem; color: #c6ccd1; }
  .savebar .msg.dirty { color: var(--amber); }
  .savebar a { color: #d9dde0; }

  .photo-pick { display: flex; gap: 12px; align-items: flex-start; }
  .photo-pick img { width: 140px; height: 96px; object-fit: cover; border: 1px solid var(--line); background: var(--concrete); }
  .photo-pick .none { width: 140px; height: 96px; display: grid; place-items: center; border: 1px dashed var(--line); color: var(--muted); font-size: .85rem; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .gallery figure { margin: 0; background: #fff; border: 1px solid var(--line); }
  .gallery img { width: 100%; height: 120px; object-fit: cover; display: block; background: var(--concrete); }
  .gallery figcaption { padding: 6px 8px; font-size: .8rem; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .gallery figcaption span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gallery button.pick { all: unset; cursor: pointer; display: block; }
  .gallery button.pick:focus-visible, .gallery button.pick:hover { outline: 3px solid var(--amber); }

  .modal { position: fixed; inset: 0; background: rgba(20, 23, 27, .6); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal-box { background: var(--paper); width: min(900px, 100%); max-height: 88vh; overflow: auto; padding: 22px; border-top: 4px solid var(--amber); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }

  .login { max-width: 380px; margin: 10vh auto; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--amber); padding: 28px; }
  .login img { width: 120px; background: var(--graphite); padding: 8px 12px; margin-bottom: 18px; }
  .error { color: var(--danger); font-size: .92rem; margin: 8px 0 0; }
  .toast { position: fixed; top: 80px; right: 20px; background: var(--ink); color: #fff; padding: 10px 16px; z-index: 60; border-left: 4px solid var(--amber); }
  .toast.err { border-left-color: var(--danger); }
  .help { background: #fff4d6; border-left: 4px solid var(--amber); padding: 10px 14px; font-size: .9rem; margin-bottom: 18px; }
  code { font-family: var(--font-mono); font-size: .85em; background: var(--concrete); padding: 1px 4px; }
</style>
</head>
<body>

<section id="login-view" class="login" hidden>
  <img src="/assets/img/logo.webp" alt="Stavby Literák">
  <h2>Administrace</h2>
  <form id="login-form">
    <div class="field"><label for="pw">Heslo</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" id="pw-show"> Zobrazit heslo</label>
    <button class="btn" type="submit">Přihlásit</button>
    <p class="error" id="login-error" hidden></p>
  </form>
  <form id="code-form" hidden>
    <p>Na e-mail jsme poslali šestimístný kód. Platí 10 minut.</p>
    <div class="field"><label for="code">Kód z e-mailu</label><input id="code" inputmode="numeric" autocomplete="one-time-code" required></div>
    <button class="btn" type="submit">Ověřit</button>
    <p class="error" id="code-error" hidden></p>
  </form>
</section>

<div id="app" hidden>
  <header class="topbar">
    <img src="/assets/img/logo.webp" alt="">
    <span class="title">Administrace webu</span>
    <span class="spacer"></span>
    <a href="/" target="_blank" rel="noopener">Otevřít web ↗</a>
    <button id="logout">Odhlásit</button>
  </header>
  <div class="layout">
    <nav class="side" aria-label="Sekce administrace">
      <h4>Web</h4>
      <ul>
        <li><button class="nav" data-view="home">Úvodní stránka</button></li>
        <li><button class="nav" data-view="settings">Kontakty a formulář</button></li>
        <li><button class="nav" data-view="reviews">Recenze</button></li>
        <li><button class="nav" data-view="images">Fotky</button></li>
      </ul>
      <h4>Stránky služeb</h4>
      <ul id="page-list"></ul>
      <div style="padding:10px 6px"><button class="btn btn-line btn-small" id="new-page">+ Nová stránka</button></div>
    </nav>
    <main class="main" id="view"></main>
  </div>
  <div class="savebar" id="savebar" hidden>
    <span class="msg" id="save-msg"></span>
    <a id="preview-link" href="/" target="_blank" rel="noopener">Zobrazit na webu ↗</a>
    <button class="btn" id="save">Uložit změny</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h3 id="modal-title">Vybrat fotku</h3><button class="btn btn-line btn-small" id="modal-close">Zavřít</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/assets/js/admin.js" defer></script>
</body>
</html>
