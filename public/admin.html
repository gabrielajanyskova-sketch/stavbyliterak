<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrace webu</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

<section id="login-view" class="login" hidden>
  <img src="/assets/img/logo.webp" alt="Stavby Literák">
  <h2>Administrace</h2>
  <form id="login-form">
    <div class="field"><label for="pw">Heslo</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" id="pw-show"> Zobrazit heslo</label>
    <button class="btn" type="submit">Přihlásit</button>
    <p class="error" id="login-error" hidden></p>
  </form>
  <form id="code-form" hidden>
    <p>Na e-mail jsme poslali šestimístný kód. Platí 10 minut.</p>
    <div class="field"><label for="code">Kód z e-mailu</label><input id="code" inputmode="numeric" autocomplete="one-time-code" required></div>
    <button class="btn" type="submit">Ověřit</button>
    <p class="error" id="code-error" hidden></p>
  </form>
</section>

<div id="app" hidden>
  <header class="topbar">
    <img src="/assets/img/logo.webp" alt="">
    <span class="title">Administrace webu</span>
    <span class="spacer"></span>
    <a href="/" target="_blank" rel="noopener">Otevřít web ↗</a>
    <button id="logout">Odhlásit</button>
  </header>
  <div class="layout">
    <nav class="side" aria-label="Sekce administrace">
      <h4>Web</h4>
      <ul>
        <li><button class="nav" data-view="home">Úvodní stránka</button></li>
        <li><button class="nav" data-view="settings">Kontakty a formulář</button></li>
        <li><button class="nav" data-view="reviews">Recenze</button></li>
        <li><button class="nav" data-view="images">Fotky</button></li>
      </ul>
      <h4>Stránky služeb</h4>
      <ul id="page-list"></ul>
      <div class="new-page"><button class="btn btn-line btn-small" id="new-page">+ Nová stránka</button></div>
    </nav>
    <main class="main" id="view"></main>
  </div>
  <div class="savebar" id="savebar" hidden>
    <span class="msg" id="save-msg"></span>
    <a id="preview-link" href="/" target="_blank" rel="noopener">Zobrazit na webu ↗</a>
    <button class="btn" id="save">Uložit změny</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h3 id="modal-title">Vybrat fotku</h3><button class="btn btn-line btn-small" id="modal-close">Zavřít</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/assets/js/admin.js" defer></script>
</body>
</html>
