# Konfigurace Cloudflare Pages — bindingy se načítají odsud při každém nasazení.
# Heslo do adminu (ADMIN_PASSWORD) a případný RESEND_API_KEY se sem NEPÍŠOU,
# nastavují se jako Secret v dashboardu: Pages → stavbyliterak → Settings → Variables and Secrets.
name = "stavbyliterak"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "stavbyliterak"
database_id = "bb7e2e11-4003-4dc1-b909-bc4f49f9a8ae"

[[kv_namespaces]]
binding = "IMAGES"
id = "d07e7e8c1dd34e2cbba047ab8fdf6a97"

[vars]
# Hlavní adresa webu: canonical, sitemap, schema.org. Jiné adresy (*.pages.dev)
# dostanou noindex, stavbyliterak.cz bez www se přesměruje sem.
SITE_URL = "https://www.stavbyliterak.cz"
# E-maily přes Resend (doména stavbyliterak.cz ověřená v Resendu, klíč je secret RESEND_API_KEY).
# Bez klíče formulář otevře e-mailový program návštěvníka a do adminu stačí heslo.
MAIL_FROM = "Web Stavby Literák <web@stavbyliterak.cz>"
NOTIFY_EMAIL = "info@stavbyliterak.cz"       # sem chodí poptávky z formuláře
LOGIN_EMAIL = "info@stavbyliterak.cz"         # sem chodí kódy pro přihlášení do adminu
